[workspace]
resolver = "2"
members = ["crates/elfcheck", "crates/bootmap", "crates/staging", "crates/paging", "crates/cpugate", "crates/bridgecheck", "crates/descriptors", "kernel", "loader"]
default-members = ["crates/elfcheck"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
