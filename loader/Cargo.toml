[package]
name = "unios_loader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unios_elf = { path = "../crates/elfcheck" }
unios_bootmap = { path = "../crates/bootmap" }
unios_staging = { path = "../crates/staging" }
unios_paging = { path = "../crates/paging" }
unios_cpugate = { path = "../crates/cpugate" }
unios_bridgecheck = { path = "../crates/bridgecheck" }
unios_descriptors = { path = "../crates/descriptors" }
unios_rootgate = { path = "../crates/rootgate" }

[[bin]]
name = "unios_loader"
path = "src/main.rs"
test = false
bench = false

[features]
lab-debug-exit = []
lab-e2-preflight = []
lab-e2b-staging = ["lab-e2-preflight"]
lab-e2c-tables = ["lab-e2b-staging"]
lab-e2d-bridge-audit = ["lab-e2c-tables"]
lab-e2e-bounded-bridge = ["lab-e2d-bridge-audit"]
lab-e2f-descriptors = ["lab-e2e-bounded-bridge"]
lab-e2g-root-gate = ["lab-e2f-descriptors"]
lab-e2h-host-root-proof = ["lab-e2g-root-gate"]
lab-e2i-host-table-proof = ["lab-e2h-host-root-proof"]
lab-e2j-targeted-leaf-proof = ["lab-e2i-host-table-proof"]
lab-e2k-emergency-closure = ["lab-e2j-targeted-leaf-proof"]
lab-e2k-smoke-generic = ["lab-e2k-emergency-closure", "lab-debug-exit"]
lab-e2k-smoke-df = ["lab-e2k-emergency-closure", "lab-debug-exit"]
