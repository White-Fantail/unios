[package]
name = "unios_loader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unios_elf = { path = "../crates/elfcheck" }
unios_bootmap = { path = "../crates/bootmap" }
unios_staging = { path = "../crates/staging" }

[[bin]]
name = "unios_loader"
path = "src/main.rs"
test = false
bench = false

[features]
lab-debug-exit = []
lab-e2-preflight = []
lab-e2b-staging = ["lab-e2-preflight"]
