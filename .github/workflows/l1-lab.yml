name: L1 experimental E2q/E2r regression and independent QEMU witness
on:
  push:
    branches:
      - "experiment/l1-e2q-cr3-terminal-bridge"
      - "experiment/l1-e2r-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and cross targets
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component llvm-tools-preview --target x86_64-unknown-none --target x86_64-unknown-uefi
          rustup show active-toolchain
      - name: Host oracle negative controls (simulation only)
        run: python3 -m unittest discover -s tests -v
      - name: Build freestanding ELF and UEFI PE, validate artifacts
        run: bash scripts/build-l1.sh
      - name: Install restricted QEMU preflight dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf gdisk dosfstools mtools
      - name: E2q QEMU 21-target old/new private root and terminal bridge code mapping preflight (NOT kernel boot)
        run: bash scripts/qemu-preflight.sh
      - name: E2r-C5 QEMU real private CR3 and CPU GDT IDT TSS witness (NO kernel boot)
        run: bash scripts/e2r-c5-terminal.sh
      - name: E2r-C6 actual high-half ELF entry and fifth paused QMP CPU witness (NO exit 65)
        run: bash scripts/e2r-c6-terminal.sh
      - name: E2q QEMU regressions, ExitBS and real CR3 with third paused QMP live CPU proof
        run: bash scripts/e2q-terminal-regressions.sh
      - name: E2r-C1 independently prove linked high-entry PE RX via 23-target QMP (NO high-half execution)
        run: bash scripts/e2r-c1-preflight.sh
      - name: E2r-C4 independent QMP 25-target descriptor stub RX proof (NO LGDT)
        run: bash scripts/e2r-c4-preflight.sh
      - name: Upload reproducibility and artifact evidence (NOT boot proof)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unios-l1-e2q
          path: |
            out/
            target/x86_64-unknown-none/release/unios_kernel
            target/x86_64-unknown-uefi/release/unios_loader.efi
          if-no-files-found: warn
          retention-days: 14
