name: L1 experimental E2i independent QEMU upper-level old-CR3 table witness
on:
  push:
    branches:
      - "experiment/l1-e2i-qemu-page-table-witness"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and cross targets
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component llvm-tools-preview --target x86_64-unknown-none --target x86_64-unknown-uefi
          rustup show active-toolchain
      - name: Host oracle negative controls (simulation only)
        run: python3 -m unittest discover -s tests -v
      - name: Build freestanding ELF and UEFI PE, validate artifacts
        run: bash scripts/build-l1.sh
      - name: Install restricted QEMU preflight dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf gdisk dosfstools mtools
      - name: E2i QEMU paused CPU PML4 and PDPT physical/virtual frames (NOT kernel boot)
        run: bash scripts/qemu-preflight.sh
      - name: Upload reproducibility and artifact evidence (NOT boot proof)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unios-l1-e2i
          path: |
            out/
            target/x86_64-unknown-none/release/unios_kernel
            target/x86_64-unknown-uefi/release/unios_loader.efi
          if-no-files-found: warn
          retention-days: 14
